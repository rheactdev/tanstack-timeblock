# Local CouchDB only; run the application on the host with npm run dev.
services:
  couchdb:
    image: couchdb:3
    # Skip root ownership changes, which fail on the read-only config mount.
    user: "5984:5984"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-timestripe}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb-data:/opt/couchdb/data
      # Keep docker.ini last so CouchDB can persist runtime configuration there.
      - ./couchdb/single-node.ini:/opt/couchdb/etc/local.d/10-single-node.ini:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          for endpoint in _up _users _replicator; do
            curl --fail --silent --show-error --max-time 2 \
              --user "$${COUCHDB_USER}:$${COUCHDB_PASSWORD}" \
              "http://127.0.0.1:5984/$$endpoint" > /dev/null || exit 1
          done
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  couchdb-data:

# Coolify: select the Docker Compose build strategy and this file as its location.
# Assign a public domain only to app, routing to its internal port 3000.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      SERVICE_URL_APP_3000: /
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${SERVICE_URL_APP_3000}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a persistent random BETTER_AUTH_SECRET of at least 32 characters}
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-timestripe}
      COUCHDB_USER: ${COUCHDB_USER:-timestripe}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in Coolify}
    command:
      - /bin/sh
      - -c
      - node scripts/init-couchdb.mjs && exec node .output/server/index.mjs
    depends_on:
      couchdb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(3000) }).then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  couchdb:
    build:
      context: ./couchdb
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-timestripe}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in Coolify}
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          for endpoint in _up _users _replicator; do
            curl --fail --silent --show-error --max-time 2 \
              --user "$${COUCHDB_USER}:$${COUCHDB_PASSWORD}" \
              "http://127.0.0.1:5984/$$endpoint" > /dev/null || exit 1
          done
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  couchdb-data:
